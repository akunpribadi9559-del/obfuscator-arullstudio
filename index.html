<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUTZ STUDIO V1 — Obfuscator & Deobfuscator</title>
<style>
:root{color-scheme:dark;--bg:#09090d;--panel:#15151f;--line:#303044;--muted:#aaaabe;--white:#f5f5fa;--accent:#8b5cf6;--accent2:#6d28d9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#292044 0,transparent 48%),var(--bg);color:var(--white);font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif}
.wrap{max-width:1140px;margin:auto;padding:22px 14px 40px}.brand{text-align:center;padding:18px 0}.tag{display:inline-block;border:1px solid #57428a;border-radius:99px;padding:4px 10px;color:#d5c6ff;font-size:11px;letter-spacing:.12em}.brand h1{font-size:clamp(38px,8vw,68px);line-height:1;margin:12px 0 8px;letter-spacing:.04em;text-shadow:3px 3px 0 #3d2a72}.brand p{color:#b7adcf;letter-spacing:.15em;font-size:11px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{background:linear-gradient(180deg,#191925,#111119);border:1px solid var(--line);border-radius:15px;padding:15px;min-width:0}.panel h2{font-size:14px;margin:0 0 8px;letter-spacing:.08em}.hint{font-size:12px;color:var(--muted);margin:0 0 12px}
textarea{width:100%;min-height:360px;resize:vertical;background:#090910;border:1px solid #343448;border-radius:10px;color:#e9e7f3;padding:13px;font:13px/1.55 ui-monospace,Consolas,monospace;outline:none;tab-size:4}textarea:focus{border-color:var(--accent)}
.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:750;cursor:pointer;color:white;background:var(--accent);transition:filter .15s}.btn:hover:not(:disabled){filter:brightness(1.12)}.btn.secondary{background:#292938;border:1px solid #414154}.btn:disabled{opacity:.45;cursor:not-allowed}.status{font-size:12px;color:#c4b5fd;min-height:18px;margin-top:10px;line-height:1.45}
@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.brand{padding:18px 0}.panel textarea{min-height:260px}}
</style>
</head>
<body>
<div class="wrap">
<header class="brand">
 <h1>DUTZ STUDIO</h1>
 <p>OBFUSCATOR & DEOBFUSCATOR • V1</p>
</header>
<div class="grid">
 <section class="panel">
  <h2>SOURCE CODE</h2>
  <p class="hint">Tempel/Upload script di Dibawah</p>
  <textarea id="source" spellcheck="false" placeholder=""></textarea>
  <input id="fileInput" type="file" accept=".lua,.luau,.txt,text/plain" hidden>

  <div class="controls">
   <button class="btn" id="uploadFile" type="button">UPLOAD FILE</button>
   <button class="btn" id="obfuscate">OBFUSCATOR</button>
   <button class="btn" id="deobfuscate">DEOBFUSCATOR</button>
   <button class="btn secondary" id="clear">CLEAR</button>
  </div>
 </section>
 <section class="panel">
  <h2>OUTPUT</h2>
  <p class="hint">Hasil OBFUSCATOR atau DEOBFUSCATOR dibawah.</p>
  <textarea id="output" spellcheck="false" readonly placeholder=""></textarea>
  <div class="controls">
   <button class="btn" id="copy" disabled>COPY</button>
   <button class="btn secondary" id="download" disabled>DOWNLOAD FILE</button>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
 </section>
</div>
</div>
<script>
const $ = id => document.getElementById(id);

$('uploadFile').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', async event => {
 const file = event.target.files && event.target.files[0];
 if (!file) return;
 if (!/\.(lua|luau|txt)$/i.test(file.name)) {
  $('status').textContent = 'Format file tidak didukung. Pilih file .lua, .luau, atau .txt.';
  event.target.value = '';
  return;
 }
 if (file.size > 5 * 1024 * 1024) {
  $('status').textContent = 'Ukuran file maksimal 5 MB.';
  event.target.value = '';
  return;
 }
 try {
  $('source').value = await file.text();
  $('status').textContent = 'File berhasil dimuat: ' + file.name;
 } catch {
  $('status').textContent = 'Gagal membaca file. Coba pilih file lain.';
 }
 event.target.value = '';
});

const LUA_KEYWORDS = new Set([
 'and','break','do','else','elseif','end','false','for','function','goto',
 'if','in','local','nil','not','or','repeat','return','then','true','until','while','continue'
]);

const ROBLOX_GLOBALS = new Set([
 'game','workspace','Instance','task','Vector3','Vector2','Vector3int16','Vector2int16',
 'CFrame','Color3','BrickColor','UDim2','UDim','TweenInfo','RaycastParams','OverlapParams',
 'NumberRange','NumberSequence','NumberSequenceKeypoint','ColorSequence','ColorSequenceKeypoint',
 'PhysicalProperties','Region3','Region3int16','Rect','Axes','Faces','Ray','Random','DateTime',
 'Enum','math','string','table','bit32','os','coroutine','debug','utf8','buffer',
 'pairs','ipairs','next','select','unpack','tonumber','tostring','type','typeof',
 'pcall','xpcall','error','assert','print','warn','require','setmetatable','getmetatable',
 'rawget','rawset','rawequal','rawlen','newproxy','shared','_G','script','tick','time','elapsedTime',
 'wait','spawn','delay','loadstring'
]);

function unescapeLuaString(rawLiteral) {
 const q = rawLiteral[0];
 if ((q !== '"' && q !== "'") || rawLiteral[rawLiteral.length - 1] !== q) return null;
 const inner = rawLiteral.slice(1, -1);
 let out = '', i = 0;
 while (i < inner.length) {
  const c = inner[i];
  if (c !== '\\') { out += c; i++; continue; }
  const n = inner[i + 1];
  if (n === undefined) break;
  if (n === 'z') {
   i += 2;
   while (i < inner.length && /\s/.test(inner[i])) i++;
   continue;
  }
  if (n === 'x' || n === 'X') {
   const hex = inner.slice(i + 2, i + 4);
   if (/^[0-9a-fA-F]{2}$/.test(hex)) { out += String.fromCharCode(parseInt(hex, 16)); i += 4; continue; }
  }
  if (n === 'u' && inner[i + 2] === '{') {
   const end = inner.indexOf('}', i + 3);
   if (end > i + 3) {
    const hex = inner.slice(i + 3, end);
    if (/^[0-9a-fA-F]{1,6}$/.test(hex)) {
     try { out += String.fromCodePoint(parseInt(hex, 16)); i = end + 1; continue; } catch {}
    }
   }
  }
  if (/[0-9]/.test(n)) {
   let j = i + 1;
   while (j < inner.length && j < i + 4 && /[0-9]/.test(inner[j])) j++;
   const code = Number(inner.slice(i + 1, j));
   if (code >= 0 && code <= 255) { out += String.fromCharCode(code); i = j; continue; }
  }
  const map = { a: '\x07', b: '\b', f: '\f', n: '\n', r: '\r', t: '\t', v: '\v', '\\': '\\', '"': '"', "'": "'", '\n': '\n', '\r': '\r' };
  if (n in map) { out += map[n]; i += 2; continue; }
  out += n; i += 2;
 }
 return out;
}

function toLuaString(str) {
 return '"' + String(str)
  .replace(/\\/g, '\\\\')
  .replace(/"/g, '\\"')
  .replace(/\n/g, '\\n')
  .replace(/\r/g, '\\r')
  .replace(/\t/g, '\\t')
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, ch => '\\' + ch.charCodeAt(0)) + '"';
}

function readLongString(text, startIdx) {
 if (text[startIdx] !== '[') return null;
 let j = startIdx + 1, eq = 0;
 while (text[j] === '=') { eq++; j++; }
 if (text[j] !== '[') return null;
 const close = ']' + '='.repeat(eq) + ']';
 const end = text.indexOf(close, j + 1);
 if (end < 0) return null;
 return { value: text.slice(j + 1, end), endIndex: end + close.length };
}

/* ============================================================================
 * DUTZ STUDIO V7 OBFUSCATOR ENGINE
 * ============================================================================ */

function tokenizeLuauV7(src) {
 const tokens = [];
 let i = 0;
 const len = src.length;
 while (i < len) {
  const c = src[i], n = src[i + 1];
  if (/\s/.test(c)) { i++; continue; }

  // Comments
  if (c === '-' && n === '-') {
   const ls = readLongString(src, i + 2);
   if (ls) { i = ls.endIndex; continue; }
   while (i < len && src[i] !== '\n' && src[i] !== '\r') i++;
   continue;
  }

  // Quoted strings
  if (c === '"' || c === "'") {
   const q = c;
   let j = i + 1;
   while (j < len) {
    if (src[j] === '\\') { j += 2; continue; }
    if (src[j++] === q) break;
   }
   tokens.push({ type: 'string', value: src.slice(i, j) });
   i = j;
   continue;
  }

  // Luau backtick interpolated strings `...`
  if (c === '`') {
   let j = i + 1, braceDepth = 0;
   while (j < len) {
    const ch = src[j];
    if (ch === '\\') { j += 2; continue; }
    if (ch === '{') { braceDepth++; j++; continue; }
    if (ch === '}' && braceDepth > 0) { braceDepth--; j++; continue; }
    if (ch === '`' && braceDepth === 0) { j++; break; }
    j++;
   }
   tokens.push({ type: 'interp', value: src.slice(i, j) });
   i = j;
   continue;
  }

  // Long strings [[...]] / [=[...]=]
  if (c === '[') {
   const ls = readLongString(src, i);
   if (ls) {
    tokens.push({ type: 'longstring', value: src.slice(i, ls.endIndex), raw: ls.value });
    i = ls.endIndex;
    continue;
   }
  }

  // Numbers (hex 0x..., binary 0b..., decimal/float with optional _ separators)
  if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(n))) {
   let j = i;
   if (c === '0' && (n === 'x' || n === 'X')) {
    j += 2;
    while (j < len && /[0-9a-fA-F_]/.test(src[j])) j++;
   } else if (c === '0' && (n === 'b' || n === 'B')) {
    j += 2;
    while (j < len && /[01_]/.test(src[j])) j++;
   } else {
    while (j < len && /[0-9_]/.test(src[j])) j++;
    if (src[j] === '.' && src[j + 1] !== '.') {
     j++;
     while (j < len && /[0-9_]/.test(src[j])) j++;
    }
    if (src[j] === 'e' || src[j] === 'E') {
     j++;
     if (src[j] === '+' || src[j] === '-') j++;
     while (j < len && /[0-9_]/.test(src[j])) j++;
    }
   }
   tokens.push({ type: 'number', value: src.slice(i, j) });
   i = j;
   continue;
  }

  // Identifiers & Keywords
  if (/[A-Za-z_]/.test(c)) {
   let j = i + 1;
   while (j < len && /[A-Za-z0-9_]/.test(src[j])) j++;
   const word = src.slice(i, j);
   tokens.push({ type: LUA_KEYWORDS.has(word) ? 'keyword' : 'word', value: word });
   i = j;
   continue;
  }

  // Multi-char operators
  const ops = ['...', '..=', '..', '::', '->', '==', '~=', '<=', '>=', '+=', '-=', '*=', '/=', '//=', '%=', '^='];
  const op = ops.find(x => src.startsWith(x, i));
  if (op) {
   tokens.push({ type: 'symbol', value: op });
   i += op.length;
   continue;
  }

  tokens.push({ type: 'symbol', value: c });
  i++;
 }
 return tokens;
}

function lzwCompressBase36(byteArray) {
 if (!byteArray || byteArray.length === 0) return '';
 const dict = new Map();
 for (let i = 0; i < 256; i++) dict.set(String.fromCharCode(i), i);
 let nextCode = 256;
 let w = String.fromCharCode(byteArray[0]);
 const codes = [];
 for (let i = 1; i < byteArray.length; i++) {
  const c = String.fromCharCode(byteArray[i]);
  const wc = w + c;
  if (dict.has(wc)) {
   w = wc;
  } else {
   codes.push(dict.get(w));
   dict.set(wc, nextCode++);
   w = c;
  }
 }
 codes.push(dict.get(w));
 let out = '';
 for (let i = 0; i < codes.length; i++) {
  const b36 = codes[i].toString(36).toUpperCase();
  const len36 = b36.length.toString(36).toUpperCase();
  out += len36 + b36;
 }
 return out;
}

function floatToLdexpParts(num) {
 if (num === 0) return { m: 0, e: 0 };
 const buf = new ArrayBuffer(8);
 const f64 = new Float64Array(buf);
 const u32 = new Uint32Array(buf);
 f64[0] = num;
 const lo = u32[0];
 const hi = u32[1];
 const sign = (hi >>> 31) ? -1 : 1;
 const rawExp = (hi >>> 20) & 0x7FF;
 const fracHi = hi & 0xFFFFF;
 if (rawExp === 0x7FF || (rawExp === 0 && fracHi === 0 && lo === 0)) return null;
 let mantissa, exp;
 if (rawExp === 0) {
  mantissa = fracHi * 4294967296 + lo;
  exp = 1 - 1023 - 52;
 } else {
  mantissa = (fracHi + 0x100000) * 4294967296 + lo;
  exp = rawExp - 1023 - 52;
 }
 return { m: sign * mantissa, e: exp };
}

function obfuscateLuauV7(src, options = {}) {
 const opts = {
  rename: options.rename !== false,
  strings: options.strings !== false,
  numbers: options.numbers !== false,
  envProps: options.envProps !== false,
  controlFlow: options.controlFlow !== false,
  antiTamper: options.antiTamper !== false
 };

 const tokens = tokenizeLuauV7(src);
 if (!tokens.length) return 'return(function(...)end)(...)';

 // Generator nama acak yang unik & membingungkan
 const usedIdents = new Set(LUA_KEYWORDS);
 ROBLOX_GLOBALS.forEach(g => usedIdents.add(g));
 for (const tk of tokens) {
  if (tk.type === 'word') usedIdents.add(tk.value);
 }

 const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
 const makeIdent = (() => {
  let counter = randInt(10, 99);
  const styles = [
   () => {
    const chars = 'lI1';
    let s = Math.random() < 0.5 ? '_l' : '_I';
    for (let i = 0; i < 6; i++) s += chars[randInt(0, 2)];
    return s + (counter++).toString(36);
   },
   () => '_0x' + randInt(0x10000, 0xFFFFF).toString(16) + (counter++).toString(16),
   () => '__' + ['lI','Il','ll','II'][randInt(0,3)] + randInt(100, 999) + (counter++)
  ];
  return () => {
   let name;
   do {
    name = styles[randInt(0, styles.length - 1)]();
   } while (usedIdents.has(name));
   usedIdents.add(name);
   return name;
  };
 })();

 // Helper identitas internal VM
 const idSb = makeIdent(), idSc = makeIdent(), idSs = makeIdent(), idTc = makeIdent(), idTn = makeIdent();
 const idBx = makeIdent(), idLdexp = makeIdent(), idLzw = makeIdent(), idRaw = makeIdent();
 const idK = makeIdent(), idEnv = makeIdent(), idPc = makeIdent();

 // String Pool Manager
 const stringPool = [];
 const stringIndexMap = new Map();
 const addString = str => {
  if (stringIndexMap.has(str)) return stringIndexMap.get(str);
  const idx = stringPool.length + 1; // 1-based Lua index
  stringPool.push(str);
  stringIndexMap.set(str, idx);
  return idx;
 };

 // Number Encoder (menggunakan _bx atau _ldexp)
 let usedBx = false, usedLdexp = false;
 const encodeNumber = rawNumToken => {
  if (!opts.numbers) return rawNumToken;
  const clean = rawNumToken.replace(/_/g, '');
  let val;
  if (/^0[bB][01]+$/.test(clean)) val = parseInt(clean.slice(2), 2);
  else val = Number(clean);
  if (!Number.isFinite(val)) return rawNumToken;

  if (Number.isInteger(val) && val >= 0 && val <= 0x7FFFFFFF) {
   const key = randInt(1, 0x7FFFFFFF);
   const xored = (val ^ key) >>> 0;
   usedBx = true;
   return `${idBx}(${xored},${key})`;
  }
  const parts = floatToLdexpParts(val);
  if (parts && Math.abs(parts.m) <= Number.MAX_SAFE_INTEGER) {
   usedLdexp = true;
   const signPrefix = parts.m < 0 ? '-' : '';
   const absM = Math.abs(parts.m);
   if (absM <= 0x7FFFFFFF) {
    const key = randInt(1, 0x7FFFFFFF);
    const xored = (absM ^ key) >>> 0;
    usedBx = true;
    return `${signPrefix}${idLdexp}(${idBx}(${xored},${key}),${parts.e})`;
   }
   return `${signPrefix}${idLdexp}(${absM},${parts.e})`;
  }
  return rawNumToken;
 };

 const encodeBool = boolVal => {
  if (!opts.numbers) return boolVal ? 'true' : 'false';
  const a = randInt(0x1000, 0x7FFFFFFF);
  const b = randInt(0x1000, 0x7FFFFFFF);
  const c = (a ^ b) >>> 0;
  usedBx = true;
  if (boolVal) return `(${idBx}(${a},${b})==${c})`;
  const wrong = (c ^ randInt(1, 255)) >>> 0;
  return `(${idBx}(${a},${b})==${wrong})`;
 };

 // ==========================================================================
 // PASS 1: SCOPE-AWARE IDENTIFIER SCRAMBLING
 // ==========================================================================
 const tokenRename = new Map();
 const scopes = [new Map()];
 const blockKinds = [];
 const curScope = () => scopes[scopes.length - 1];
 const pushScope = kind => { scopes.push(new Map()); blockKinds.push(kind); };
 const popScope = () => { if (scopes.length > 1) { scopes.pop(); blockKinds.pop(); } };
 const resolveIdent = name => {
  for (let s = scopes.length - 1; s >= 0; s--) {
   if (scopes[s].has(name)) return scopes[s].get(name);
  }
  return null;
 };
 const declareLocal = (tokIdx, name) => {
  if (!opts.rename || LUA_KEYWORDS.has(name)) {
   curScope().set(name, name);
   return;
  }
  const newName = makeIdent();
  curScope().set(name, newName);
  tokenRename.set(tokIdx, newName);
 };

 // Pre-scan table field keys `{ key = val }` so they aren't confused with variables
 const tableKeyIndices = new Set();
 {
  const braceTypes = []; // 'table' or 'other'
  let pDepth = 0, bDepth = 0;
  for (let i = 0; i < tokens.length; i++) {
   const t = tokens[i];
   if (t.value === '(') pDepth++;
   else if (t.value === ')') pDepth = Math.max(0, pDepth - 1);
   else if (t.value === '[') bDepth++;
   else if (t.value === ']') bDepth = Math.max(0, bDepth - 1);
   else if (t.value === '{') braceTypes.push({ pDepth, bDepth });
   else if (t.value === '}') braceTypes.pop();
   else if (
    t.type === 'word' &&
    braceTypes.length > 0 &&
    braceTypes[braceTypes.length - 1].pDepth === pDepth &&
    braceTypes[braceTypes.length - 1].bDepth === bDepth &&
    tokens[i + 1]?.value === '=' &&
    ['{', ',', ';'].includes(tokens[i - 1]?.value)
   ) {
    tableKeyIndices.add(i);
   }
  }
 }

 // Pre-scan function header method declarations `function a.b.c(...)`
 const funcHeaderIndices = new Set();
 for (let i = 0; i < tokens.length; i++) {
  if (tokens[i].value === 'function') {
   let j = i + 1;
   while (j < tokens.length && tokens[j].value !== '(') {
    funcHeaderIndices.add(j);
    j++;
   }
  }
 }

 // Scope walk
 for (let i = 0; i < tokens.length; i++) {
  const t = tokens[i], v = t.value;
  if (v === 'then' || v === 'repeat') { pushScope(v); continue; }
  if (v === 'do') {
   if (blockKinds[blockKinds.length - 1] !== 'for') pushScope('do');
   continue;
  }
  if (v === 'elseif' || v === 'else') {
   popScope();
   if (v === 'else') pushScope('else');
   continue;
  }
  if (v === 'end' || v === 'until') { popScope(); continue; }

  // `local function name(p1, p2)`
  if (v === 'local' && tokens[i + 1]?.value === 'function' && tokens[i + 2]?.type === 'word') {
   declareLocal(i + 2, tokens[i + 2].value);
   pushScope('function');
   let j = i + 3;
   if (tokens[j]?.value === '(') {
    j++;
    while (j < tokens.length && tokens[j].value !== ')') {
     if (tokens[j].type === 'word' && tokens[j - 1]?.value !== ':') {
      declareLocal(j, tokens[j].value);
     }
     j++;
    }
   }
   i = j;
   continue;
  }

  // `function [name](p1, p2)`
  if (v === 'function') {
   let j = i + 1;
   while (j < tokens.length && tokens[j].value !== '(') {
    if (tokens[j].type === 'word' && tokens[j - 1]?.value !== '.' && tokens[j - 1]?.value !== ':') {
     const ref = resolveIdent(tokens[j].value);
     if (ref) tokenRename.set(j, ref);
    }
    j++;
   }
   pushScope('function');
   if (tokens[j]?.value === '(') {
    j++;
    while (j < tokens.length && tokens[j].value !== ')') {
     if (tokens[j].type === 'word' && tokens[j - 1]?.value !== ':') {
      declareLocal(j, tokens[j].value);
     }
     j++;
    }
   }
   i = j;
   continue;
  }

  // `for k, v in ... do` / `for i = 1, 10 do`
  if (v === 'for') {
   pushScope('for');
   let j = i + 1;
   while (j < tokens.length && tokens[j].value !== '=' && tokens[j].value !== 'in' && tokens[j].value !== 'do') {
    if (tokens[j].type === 'word' && tokens[j - 1]?.value !== ':') {
     declareLocal(j, tokens[j].value);
    }
    j++;
   }
   i = j - 1;
   continue;
  }

  // `local a, b = ...`
  if (v === 'local' && tokens[i + 1]?.value !== 'function') {
   let j = i + 1;
   while (j < tokens.length) {
    if (tokens[j].type === 'word') {
     declareLocal(j, tokens[j].value);
     j++;
     // Lewati anotasi tipe Luau jika ada (`local x: number`)
     if (tokens[j]?.value === ':') {
      j++;
      let tDepth = 0;
      while (j < tokens.length) {
       const tv = tokens[j].value;
       if (tv === '(' || tv === '{' || tv === '[' || tv === '<') tDepth++;
       else if (tv === ')' || tv === '}' || tv === ']' || tv === '>') tDepth = Math.max(0, tDepth - 1);
       else if (tDepth === 0 && (tv === ',' || tv === '=' || tv === ';' || LUA_KEYWORDS.has(tv))) break;
       j++;
      }
     }
     if (tokens[j]?.value === ',') { j++; continue; }
    }
    break;
   }
   i = j - 1;
   continue;
  }

  // Referensi variabel biasa
  if (
   t.type === 'word' &&
   !tableKeyIndices.has(i) &&
   tokens[i - 1]?.value !== '.' &&
   tokens[i - 1]?.value !== ':'
  ) {
   const ref = resolveIdent(v);
   if (ref) tokenRename.set(i, ref);
  }
 }

 // ==========================================================================
 // PASS 2: TRANSFORM TOKENS (STRINGS, NUMBERS, GLOBALS, PROPERTIES, METHODS)
 // ==========================================================================
 const outPieces = [];
 let usedEnv = false;

 for (let i = 0; i < tokens.length; i++) {
  const t = tokens[i], v = t.value;
  const prev = tokens[i - 1];
  const next = tokens[i + 1];

  // 1. String & Longstring encryption
  if (t.type === 'string' && opts.strings) {
   const decoded = unescapeLuaString(v);
   if (decoded !== null) {
    const idx = addString(decoded);
    outPieces.push(`${idK}[${idx}]`);
    continue;
   }
  }
  if (t.type === 'longstring' && opts.strings) {
   const idx = addString(t.raw);
   outPieces.push(`${idK}[${idx}]`);
   continue;
  }

  // 2. Numbers & Booleans
  if (t.type === 'number' && prev?.value !== '.' && prev?.value !== ':') {
   outPieces.push(encodeNumber(v));
   continue;
  }
  if (t.type === 'keyword' && (v === 'true' || v === 'false')) {
   outPieces.push(encodeBool(v === 'true'));
   continue;
  }

  // 3. Table keys `{ key = val }` -> `{ [_K[idx]] = val }`
  if (tableKeyIndices.has(i) && opts.envProps && opts.strings) {
   const idx = addString(v);
   outPieces.push(`[${idK}[${idx}]]`);
   continue;
  }

  // 4. Property access `obj.Prop` -> `obj[_K[idx]]` (kecuali di header `function a.b()`)
  if (
   prev?.value === '.' &&
   t.type === 'word' &&
   !funcHeaderIndices.has(i) &&
   opts.envProps &&
   opts.strings
  ) {
   // Ganti simbol '.' sebelumnya dengan indexing [_K[idx]]
   outPieces.pop();
   const idx = addString(v);
   outPieces.push(`[${idK}[${idx}]]`);
   continue;
  }

  // 5. Method call pada identifier sederhana: `ident:Method(args)` -> `ident[_K[idx]](ident, args)`
  if (
   prev?.value === ':' &&
   t.type === 'word' &&
   !funcHeaderIndices.has(i) &&
   next?.value === '(' &&
   opts.envProps &&
   opts.strings
  ) {
   const receiverTok = tokens[i - 2];
   if (receiverTok && receiverTok.type === 'word' && tokens[i - 3]?.value !== '.' && tokens[i - 3]?.value !== ':') {
    const receiverCode = outPieces[outPieces.length - 2]; // sudah ditransformasi (mis. _ENV[_K[1]] atau _lI1l1)
    outPieces.pop(); // buang ':'
    const idx = addString(v);
    outPieces.push(`[${idK}[${idx}]]`);
    outPieces.push('(');
    // Cek apakah argumen kosong `()` atau ada isi `(a, b)`
    if (tokens[i + 2]?.value === ')') {
     outPieces.push(receiverCode);
    } else {
     outPieces.push(receiverCode + ',');
    }
    i++; // lewati '(' karena sudah ditambahkan
    continue;
   }
  }

  // 6. Global Roblox/Lua virtualization (`game` -> `_ENV_TBL[_K[idx]]`)
  if (
   t.type === 'word' &&
   !tokenRename.has(i) &&
   !tableKeyIndices.has(i) &&
   !funcHeaderIndices.has(i) &&
   prev?.value !== '.' &&
   prev?.value !== ':' &&
   ROBLOX_GLOBALS.has(v) &&
   opts.envProps &&
   opts.strings
  ) {
   usedEnv = true;
   const idx = addString(v);
   outPieces.push(`${idEnv}[${idK}[${idx}]]`);
   continue;
  }

  // 7. Renamed local identifier atau token asli
  const finalVal = tokenRename.has(i) ? tokenRename.get(i) : v;
  outPieces.push(finalVal);
 }

 // Gabungkan potongan kode dengan spasi aman antar kata
 const joinCodePieces = pieces => {
  let res = '';
  for (let i = 0; i < pieces.length; i++) {
   const cur = pieces[i];
   if (!cur) continue;
   if (res && /[A-Za-z0-9_]$/.test(res) && /^[A-Za-z0-9_]/.test(cur)) {
    res += ' ';
   }
   res += cur;
  }
  return res;
 };

 let transformedBody = joinCodePieces(outPieces);

 // ==========================================================================
 // PASS 3: CONTROL-FLOW FLATTENING (BINARY-SEARCH STATE MACHINE VM)
 // ==========================================================================
 let finalCoreCode = transformedBody;

 if (opts.controlFlow) {
  const flatTokens = tokenizeLuauV7(transformedBody);
  // Pisahkan statement top-level
  const stmts = [];
  let curStmt = [];
  let blockDepth = 0, parenDepth = 0, braceDepth = 0, bracketDepth = 0;
  let pendingFuncHeader = false;

  const flushStmt = () => {
   if (curStmt.length) {
    stmts.push(curStmt);
    curStmt = [];
   }
  };

  for (let i = 0; i < flatTokens.length; i++) {
   const tk = flatTokens[i], v = tk.value;

   // Cek apakah token ini memulai statement baru di top-level (depth === 0)
   if (
    blockDepth === 0 && parenDepth === 0 && braceDepth === 0 && bracketDepth === 0 &&
    curStmt.length > 0
   ) {
    const prevTk = curStmt[curStmt.length - 1];
    const isStarter = ['local', 'if', 'for', 'while', 'repeat', 'return', 'do'].includes(v) ||
     (v === 'function' && prevTk?.value !== '=' && prevTk?.value !== 'local' && prevTk?.value !== '(' && prevTk?.value !== ',');
    const isAssignStart = tk.type === 'word' &&
     !['.', ':', '[', '('].includes(prevTk?.value) &&
     !['for', 'until', 'return', 'then', 'do', 'else', 'elseif', '=', ',', 'and', 'or', 'not', '+', '-', '*', '/', '%', '^', '..', '==', '~=', '<', '>', '<=', '>=', '+=', '-=', '*=', '/=', '%=', '^=', '..=', 'in'].includes(prevTk?.value) &&
     (flatTokens[i + 1]?.value === '=' || flatTokens[i + 1]?.value === ',' || flatTokens[i + 1]?.value === '.' || flatTokens[i + 1]?.value === ':' || flatTokens[i + 1]?.value === '[' || flatTokens[i + 1]?.value === '(');

    if (v === ';') {
     flushStmt();
     continue;
    }
    if (isStarter || isAssignStart) {
     flushStmt();
    }
   }

   curStmt.push(tk);

   if (v === '(') parenDepth++;
   else if (v === ')') {
    parenDepth = Math.max(0, parenDepth - 1);
    if (pendingFuncHeader && parenDepth === 0) {
     blockDepth++;
     pendingFuncHeader = false;
    }
   }
   else if (v === '{') braceDepth++;
   else if (v === '}') braceDepth = Math.max(0, braceDepth - 1);
   else if (v === '[') bracketDepth++;
   else if (v === ']') bracketDepth = Math.max(0, bracketDepth - 1);
   else if (v === 'function') pendingFuncHeader = true;
   else if (v === 'then' || v === 'repeat') blockDepth++;
   else if (v === 'do') {
    // Hindari double increment jika 'do' setelah 'for' atau 'while' yang belum increment
    blockDepth++;
   }
   else if (v === 'end' || v === 'until') {
    blockDepth = Math.max(0, blockDepth - 1);
    if (blockDepth === 0 && parenDepth === 0 && braceDepth === 0 && bracketDepth === 0) {
     // Jangan flush jika 'until <expr>' masih punya ekspresi kondisi
     if (v !== 'until') flushStmt();
    }
   }
  }
  flushStmt();

  if (stmts.length >= 2) {
   const hoistedDecls = [];
   const execBlocks = [];

   for (const st of stmts) {
    // Cek `local function fn(...) ... end`
    if (st[0]?.value === 'local' && st[1]?.value === 'function' && st[2]?.type === 'word') {
     const fnIdent = st[2].value;
     hoistedDecls.push(fnIdent);
     const restTokens = [fnIdent, { type: 'symbol', value: '=' }, { type: 'keyword', value: 'function' }, ...st.slice(3)];
     execBlocks.push({ code: joinCodePieces(restTokens.map(x => x.value)), isReturn: false });
     continue;
    }

    // Cek `local a, b = ...`
    if (st[0]?.value === 'local') {
     let j = 1;
     const names = [];
     while (j < st.length) {
      if (st[j].type === 'word') {
       names.push(st[j].value);
       j++;
       if (st[j]?.value === ':') {
        j++;
        let td = 0;
        while (j < st.length) {
         const tv = st[j].value;
         if (tv === '(' || tv === '{' || tv === '[' || tv === '<') td++;
         else if (tv === ')' || tv === '}' || tv === ']' || tv === '>') td = Math.max(0, td - 1);
         else if (td === 0 && (tv === ',' || tv === '=')) break;
         j++;
        }
       }
       if (st[j]?.value === ',') { j++; continue; }
      }
      break;
     }
     names.forEach(nm => hoistedDecls.push(nm));
     if (st[j]?.value === '=') {
      const assignCode = names.join(',') + '=' + joinCodePieces(st.slice(j + 1).map(x => x.value));
      execBlocks.push({ code: assignCode, isReturn: false });
     }
     continue;
    }

    const isRet = st[0]?.value === 'return';
    execBlocks.push({ code: joinCodePieces(st.map(x => x.value)), isReturn: isRet });
   }

   if (execBlocks.length >= 2) {
    // Buat ID state acak unik
    const usedStates = new Set([0]);
    const allocState = () => {
     let s;
     do { s = randInt(100, 9999); } while (usedStates.has(s));
     usedStates.add(s);
     return s;
    };

    const stateIds = execBlocks.map(() => allocState());
    const entries = execBlocks.map((blk, idx) => {
     const nextId = idx + 1 < stateIds.length ? stateIds[idx + 1] : 0;
     const bodyWithTransition = blk.isReturn
      ? blk.code
      : `${blk.code};${idPc}=${nextId}`;
     return { id: stateIds[idx], code: bodyWithTransition };
    });

    // Tambahkan 2-3 dead decoy states untuk membingungkan analisis statis
    const decoyCount = randInt(2, 3);
    for (let d = 0; d < decoyCount; d++) {
     const dId = allocState();
     const fakeNext = stateIds[randInt(0, stateIds.length - 1)];
     const dummyVar = makeIdent();
     const kA = randInt(100, 9999), kB = randInt(100, 9999);
     usedBx = true;
     entries.push({
      id: dId,
      code: `local ${dummyVar}=${idBx}(${kA},${kB});if ${dummyVar}==${kA} then ${idPc}=${fakeNext} else ${idPc}=0 end`
     });
    }

    // Urutkan berdasarkan ID state dan bangun pohon binary-search (gaya IronBrew 2)
    entries.sort((a, b) => a.id - b.id);

    const buildBinaryDispatch = list => {
     if (list.length === 1) {
      return list[0].code;
     }
     const midIdx = Math.floor((list.length - 1) / 2);
     const pivot = list[midIdx].id;
     const leftPart = buildBinaryDispatch(list.slice(0, midIdx + 1));
     const rightPart = buildBinaryDispatch(list.slice(midIdx + 1));
     return `if ${idPc}<=${pivot} then ${leftPart} else ${rightPart} end`;
    };

    const hoistLine = hoistedDecls.length ? `local ${hoistedDecls.join(',')};` : '';
    const dispatchTree = buildBinaryDispatch(entries);
    finalCoreCode = `${hoistLine}local ${idPc}=${stateIds[0]};while ${idPc}~=0 do ${dispatchTree} end`;
   }
  }
 }

 // ==========================================================================
 // PASS 4: RAKIT RUNTIME VM HEADER (LZW + BASE36 + ROLLING XOR + ANTI-TAMPER)
 // ==========================================================================
 const headerParts = [];

 // Anti-Beautify & Anti-Tamper Check (baris 1 check)
 if (opts.antiTamper) {
  const idDbg = makeIdent(), idOk = makeIdent(), idLn = makeIdent();
  headerParts.push(
   `local ${idDbg}=debug;if ${idDbg} and ${idDbg}.info then local ${idOk},${idLn}=pcall(${idDbg}.info,1,"l");if ${idOk} and ${idLn} and ${idLn}~=1 then return end end;`
  );
 }

 if (usedBx || stringPool.length > 0) {
  const idA = makeIdent(), idB = makeIdent(), idR = makeIdent(), idM = makeIdent(), idX = makeIdent(), idY = makeIdent();
  headerParts.push(
   `local ${idBx}=(bit32 and bit32.bxor)or function(${idA},${idB})local ${idR},${idM}=0,1;while ${idA}>0 or ${idB}>0 do local ${idX},${idY}=${idA}%2,${idB}%2;if ${idX}~=${idY} then ${idR}=${idR}+${idM} end;${idA}=(${idA}-${idX})/2;${idB}=(${idB}-${idY})/2;${idM}=${idM}*2 end;return ${idR} end;`
  );
 }

 if (usedLdexp) {
  headerParts.push(`local ${idLdexp}=math.ldexp;`);
 }

 if (usedEnv) {
  headerParts.push(`local ${idEnv}=_ENV or(getfenv and getfenv());`);
 }

 if (stringPool.length > 0) {
  const xorKey1 = randInt(17, 251);
  const xorStep = randInt(3, 127) | 1; // ganjil agar periodenya maksimal
  const encoder = new TextEncoder();
  const byteStream = [];
  const count = stringPool.length;
  byteStream.push((count >>> 8) & 0xFF, count & 0xFF);

  for (let idx = 1; idx <= count; idx++) {
   const utf8 = encoder.encode(stringPool[idx - 1]);
   const len = utf8.length;
   byteStream.push((len >>> 8) & 0xFF, len & 0xFF);
   for (let j = 0; j < len; j++) {
    const enc = (utf8[j] ^ xorKey1 ^ ((idx * xorStep + j) & 0xFF)) & 0xFF;
    byteStream.push(enc);
   }
  }

  const lzwB36 = lzwCompressBase36(byteStream);
  const idF = makeIdent(), idO = makeIdent(), idE = makeIdent(), idC = makeIdent(), idA = makeIdent(), idD = makeIdent(), idL = makeIdent();
  const idG = makeIdent(), idI = makeIdent(), idN = makeIdent(), idV = makeIdent(), idKCode = makeIdent();
  const idP = makeIdent(), idCnt = makeIdent(), idIdx = makeIdent(), idLen = makeIdent(), idBuf = makeIdent(), idJ = makeIdent(), idByte = makeIdent();

  headerParts.push(
   `local ${idSb},${idSc},${idSs},${idTc},${idTn}=string.byte,string.char,string.sub,table.concat,tonumber;` +
   `local function ${idLzw}(${idF})` +
    `local ${idO},${idE},${idC},${idA},${idD},${idL}="","",{},{256},{},1;` +
    `${idA}=256;for ${idI}=0,255 do ${idD}[${idI}]=${idSc}(${idI})end;` +
    `local function ${idG}()` +
     `local ${idN}=${idTn}(${idSs}(${idF},${idL},${idL}),36);${idL}=${idL}+1;` +
     `local ${idV}=${idTn}(${idSs}(${idF},${idL},${idL}+${idN}-1),36);${idL}=${idL}+${idN};return ${idV}` +
    `end;` +
    `${idO}=${idSc}(${idG}());${idC}[1]=${idO};` +
    `while ${idL}<=#${idF} do ` +
     `local ${idKCode}=${idG}();` +
     `if ${idD}[${idKCode}] then ${idE}=${idD}[${idKCode}] else ${idE}=${idO}..${idSs}(${idO},1,1) end;` +
     `${idD}[${idA}]=${idO}..${idSs}(${idE},1,1);${idC}[#${idC}+1],${idO},${idA}=${idE},${idE},${idA}+1 ` +
    `end;return ${idTc}(${idC})` +
   `end;` +
   `local ${idRaw}=${idLzw}("${lzwB36}");local ${idK}={};` +
   `do local ${idP}=3;local ${idCnt}=${idSb}(${idRaw},1)*256+${idSb}(${idRaw},2);` +
    `for ${idIdx}=1,${idCnt} do ` +
     `local ${idLen}=${idSb}(${idRaw},${idP})*256+${idSb}(${idRaw},${idP}+1);${idP}=${idP}+2;local ${idBuf}={};` +
     `for ${idJ}=0,${idLen}-1 do ` +
      `local ${idByte}=${idSb}(${idRaw},${idP}+${idJ});` +
      `${idByte}=${idBx}(${idBx}(${idByte},${xorKey1}),(${idIdx}*${xorStep}+${idJ})%256);` +
      `${idBuf}[${idJ}+1]=${idSc}(${idByte})` +
     `end;${idK}[${idIdx}]=${idTc}(${idBuf});${idP}=${idP}+${idLen}` +
    `end ` +
   `end;`
  );
 }

 const fullPayload = headerParts.join('') + finalCoreCode;
 // Bungkus dalam IIFE vararg berlapis agar mendukung `...` dan `return` ModuleScript
 return `return(function(...)return(function(...)${fullPayload} end)(...)end)(...)`;
}

/* ============================================================================
 * FORMATTER & DEOBFUSCATOR V7 (MENDUKUNG DEOBFUSCATION + SMART ROBLOX NAMING)
 * ============================================================================ */

function tokenizeLuau(src) {
 const tokens = [];
 let i = 0;
 while (i < src.length) {
  const c = src[i], n = src[i + 1];
  if (/\s/.test(c)) { i++; continue; }
  if (c === '-' && n === '-') {
   let j = i + 2, eq = 0;
   if (src[j] === '[') {
    j++; while (src[j] === '=') { eq++; j++; }
    if (src[j] === '[') {
     const close = ']' + '='.repeat(eq) + ']';
     const e = src.indexOf(close, j + 1);
     const stop = e < 0 ? src.length : e + close.length;
     tokens.push({ type: 'comment', value: src.slice(i, stop) }); i = stop; continue;
    }
   }
   let stop = i + 2;
   while (stop < src.length && src[stop] !== '\n' && src[stop] !== '\r') stop++;
   tokens.push({ type: 'comment', value: src.slice(i, stop) }); i = stop; continue;
  }
  if (c === '"' || c === "'") {
   const q = c; let j = i + 1;
   while (j < src.length) { if (src[j] === '\\') { j += 2; continue; } if (src[j++] === q) break; }
   tokens.push({ type: 'literal', value: src.slice(i, j) }); i = j; continue;
  }
  if (c === '[') {
   let j = i + 1, eq = 0; while (src[j] === '=') { eq++; j++; }
   if (src[j] === '[') {
    const close = ']' + '='.repeat(eq) + ']';
    const e = src.indexOf(close, j + 1);
    const stop = e < 0 ? src.length : e + close.length;
    tokens.push({ type: 'literal', value: src.slice(i, stop) }); i = stop; continue;
   }
  }
  if (/[A-Za-z0-9_]/.test(c)) {
   let j = i + 1;
   while (j < src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
   tokens.push({ type: 'word', value: src.slice(i, j) }); i = j; continue;
  }
  const op = ['...', '==', '~=', '<=', '>=', '..', '+=', '-=', '*=', '/=', '%=', '^=', '..=', '::'];
  const found = op.find(x => src.startsWith(x, i));
  if (found) { tokens.push({ type: 'symbol', value: found }); i += found.length; continue; }
  tokens.push({ type: 'symbol', value: c }); i++;
 }
 return tokens;
}

function formatLuau(src) {
 const tokens = tokenizeLuau(src);
 const lines = [];
 let line = '', indent = 0, prev = null, paren = 0, bracket = 0, brace = 0;
 let pendingFunction = false, functionParenDepth = -1;
 let pendingUntil = false, untilParenDepth = 0;

 const pad = () => '    '.repeat(Math.max(0, indent));
 const flush = () => { const v = line.trim(); if (v) lines.push(pad() + v); line = ''; };
 const add = (v, space = false) => { if (space && line && !line.endsWith(' ')) line += ' '; line += v; };

 const binary = new Set(['=', '+=', '-=', '*=', '/=', '%=', '^=', '..=', '+', '-', '*', '/', '%', '^', '==', '~=', '<', '>', '<=', '>=', '..', 'and', 'or']);
 const starters = new Set(['local', 'return', 'if', 'for', 'while', 'function', 'repeat', 'break', 'continue']);

 const multilineParens = new Set();
 const parenStack = [];
 for (let idx = 0; idx < tokens.length; idx++) {
  const tk = tokens[idx];
  if (tk.type === 'comment') continue;
  if (tk.value === '(') {
   const before = tokens[idx - 1];
   const isCall = before && (before.type === 'word' || before.value === ')' || before.value === ']');
   const isFuncHead = (tokens[idx - 1]?.value === 'function') || (tokens[idx - 2]?.value === 'function');
   parenStack.push({ openIdx: idx, commas: 0, charLen: 0, isCall: isCall && !isFuncHead, hasNestedBlock: false });
  } else if (tk.value === ')') {
   const top = parenStack.pop();
   if (top) {
    if (top.isCall && top.commas >= 1 && top.charLen > 75 && !top.hasNestedBlock) {
     multilineParens.add(top.openIdx);
     multilineParens.add(idx);
    }
    if (parenStack.length) {
     parenStack[parenStack.length - 1].charLen += top.charLen + 2;
    }
   }
  } else if (parenStack.length) {
   const top = parenStack[parenStack.length - 1];
   if (tk.value === ',' && parenStack.length === 1) top.commas++;
   if (tk.value === 'function' || tk.value === 'do' || tk.value === 'then') top.hasNestedBlock = true;
   top.charLen += tk.value.length + 1;
  }
 }

 const activeMultilineDepths = new Set();

 for (let k = 0; k < tokens.length; k++) {
  const t = tokens[k], v = t.value;
  if (t.type === 'comment') {
   if (line.trim()) add(' ');
   add(v); flush(); prev = t; continue;
  }

  if (pendingUntil && paren === untilParenDepth && bracket === 0 && brace === 0) {
   const isExprContinuation = binary.has(v) || v === '(' || v === '[' || v === '.' || v === ':' ||
    (t.type === 'word' && prev && (binary.has(prev.value) || prev.value === 'not' || prev.value === '(' || prev.value === '['));
   if (!isExprContinuation && prev?.value !== 'until') {
    flush();
    pendingUntil = false;
   }
  }

  if (t.type === 'word' && starters.has(v) && paren === 0 && bracket === 0 && brace === 0 && line.trim()) {
   if (!(v === 'function' && (/\blocal\s*$/.test(line) || /=\s*$/.test(line)))) {
    flush();
   }
  }

  if (v === 'end') {
   flush(); indent = Math.max(0, indent - 1); add('end'); flush(); prev = t; continue;
  }
  if (v === 'until') {
   flush(); indent = Math.max(0, indent - 1); add('until');
   pendingUntil = true; untilParenDepth = paren;
   prev = t; continue;
  }
  if (v === 'else' || v === 'elseif') {
   flush(); indent = Math.max(0, indent - 1); add(v);
   if (v === 'else') { flush(); indent++; }
   prev = t; continue;
  }
  if (v === 'function') pendingFunction = true;
  if (v === 'repeat') { if (line.trim()) flush(); add(v); flush(); indent++; prev = t; continue; }
  if (v === 'then') { add(v, true); flush(); indent++; prev = t; continue; }
  if (v === 'do') { add(v, true); flush(); indent++; prev = t; continue; }
  if (v === ';') { flush(); prev = t; continue; }

  if (v === ',') {
   add(v);
   if (activeMultilineDepths.has(paren)) {
    flush();
   } else {
    line += ' ';
   }
   prev = t; continue;
  }

  if (v === ')' || v === ']' || v === '}') {
   if (v === ')') {
    if (multilineParens.has(k) && activeMultilineDepths.has(paren)) {
     flush();
     activeMultilineDepths.delete(paren);
     indent = Math.max(0, indent - 1);
    }
    add(v);
    const closesFunction = pendingFunction && paren === functionParenDepth;
    paren = Math.max(0, paren - 1);
    if (closesFunction) { flush(); indent++; pendingFunction = false; functionParenDepth = -1; }
   } else {
    add(v);
    if (v === ']') bracket = Math.max(0, bracket - 1);
    if (v === '}') brace = Math.max(0, brace - 1);
   }

  output = output.replace(/(['"])((?:\\.|(?!\1)[^\\\r\n])*)\1/g, whole => {
   const decoded = unescapeLuaString(whole);
   if (decoded === null) return whole;
   const normalized = toLuaString(decoded);
   if (normalized !== whole) stats.strings++;
   return normalized;
  });

  const strLibAliases = new Set(['string']);
  const charAliases = new Set(['string.char', 'string["char"]', "string['char']"]);
  const revAliases = new Set(['string.reverse', 'string["reverse"]', "string['reverse']"]);
  const byteAliases = new Set(['string.byte', 'string["byte"]', "string['byte']"]);

  let m;
  const libRe = /\blocal\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*string\b/g;
  while ((m = libRe.exec(output)) !== null) strLibAliases.add(m[1]);

  for (const lib of strLibAliases) {
   const escLib = escapeRegExp(lib);
   charAliases.add(escLib + '\\s*\\.\\s*char');
   charAliases.add(escLib + '\\s*\\[\\s*["\']char["\']\\s*\\]');
   revAliases.add(escLib + '\\s*\\.\\s*reverse');
   byteAliases.add(escLib + '\\s*\\.\\s*byte');

   const fnRe = new RegExp('\\blocal\s+([A-Za-z_][A-Za-z0-9_]*)\\s*=\\s*' + escLib + '\\s*(?:\\.\\s*(char|reverse|byte)|\\[\\s*["\'](char|reverse|byte)["\']\\s*\\])', 'g');
   while ((m = fnRe.exec(output)) !== null) {
    const fnType = m[2] || m[3];
    if (fnType === 'char') charAliases.add(escapeRegExp(m[1]));
    if (fnType === 'reverse') revAliases.add(escapeRegExp(m[1]));
    if (fnType === 'byte') byteAliases.add(escapeRegExp(m[1]));
   }
  }

  for (const name of charAliases) {
   const re = new RegExp('(?:^|(?<=[^A-Za-z0-9_.]))(?:' + name + ')\\s*\\(([^()]{1,6000})\\)', 'g');
   output = output.replace(re, (whole, argsStr) => {
    const parts = argsStr.split(',');
    if (!parts.length) return whole;
    const chars = [];
    for (const part of parts) {
     const val = evalSafeMath(part);
     if (val === null || !Number.isInteger(val) || val < 0 || val > 255) return whole;
     chars.push(String.fromCharCode(val));
    }
    stats.strings++;
    return toLuaString(chars.join(''));
   });
  }

  for (const name of revAliases) {
   const re = new RegExp('(?:' + name + ')\\s*\\(\\s*(["\'])((?:\\\\.|(?!\\1)[^\\\\])*)\\1\\s*\\)', 'g');
   output = output.replace(re, (whole, q, inner) => {
    const decoded = unescapeLuaString(q + inner + q);
    if (decoded === null) return whole;
    stats.strings++;
    return toLuaString(Array.from(decoded).reverse().join(''));
   });
  }
  for (const name of byteAliases) {
   const re = new RegExp('(?:' + name + ')\\s*\\(\\s*(["\'])((?:\\\\.|(?!\\1)[^\\\\])*)\\1(?:\\s*,\\s*(\\d+))?\\s*\\)', 'g');
   output = output.replace(re, (whole, q, inner, idxStr) => {
    const decoded = unescapeLuaString(q + inner + q);
    if (!decoded) return whole;
    const idx = idxStr ? Math.max(1, Number(idxStr)) - 1 : 0;
    if (idx >= decoded.length) return whole;
    stats.math++;
    return String(decoded.charCodeAt(idx));
   });
  }
  output = output.replace(/\btonumber\s*\(\s*(["'])([0-9a-fA-F]+)\1\s*,\s*(\d+)\s*\)/g, (whole, q, digits, baseStr) => {
   const base = Number(baseStr);
   if (base < 2 || base > 36) return whole;
   const val = parseInt(digits, base);
   if (!Number.isFinite(val)) return whole;
   stats.math++;
   return String(val);
  });

  output = output.replace(/(["'])(?:\\.|(?!\1)[^\\])*\1|--[^\n]*|\bbit32\s*\.\s*(?:bxor|band|bor|lshift|rshift|bnot)\s*\([^()]{1,200}\)|\b0[xX][0-9a-fA-F]+\b|\(\s*[0-9a-fA-FxX+\-*/%().\s]+\s*\)/g, tok => {
   if (tok.startsWith('"') || tok.startsWith("'") || tok.startsWith('--')) return tok;
   const val = evalSafeMath(tok);
   if (val !== null && Number.isInteger(val)) { stats.math++; return String(val); }
   return tok;
  });

  output = output.replace(/\btable\s*\.\s*concat\s*\(\s*\{([^{}]{1,8000})\}\s*\)/g, (whole, body) => {
   const parts = body.split(',');
   const outChars = [];
   for (const p of parts) {
    const t = p.trim();
    if (!t) continue;
    if ((t.startsWith('"') && t.endsWith('"')) || (t.startsWith("'") && t.endsWith("'"))) {
     const d = unescapeLuaString(t);
     if (d === null) return whole;
     outChars.push(d);
    } else {
     return whole;
    }
   }
   if (!outChars.length) return whole;
   stats.strings++;
   return toLuaString(outChars.join(''));
  });

  output = output.replace(/(["'])((?:\\.|(?!\1)[^\\])*)\1\s*\.\.\s*(["'])((?:\\.|(?!\3)[^\\])*)\3/g, (whole, q1, s1, q2, s2) => {
   const d1 = unescapeLuaString(q1 + s1 + q1);
   const d2 = unescapeLuaString(q2 + s2 + q2);
   if (d1 === null || d2 === null) return whole;
   stats.strings++;
   return toLuaString(d1 + d2);
  });

  output = output.replace(/\b([A-Za-z_][A-Za-z0-9_]*)\s*\[\s*["']([A-Za-z_][A-Za-z0-9_]*)["']\s*\]\s*\(\s*\1\s*(?:,\s*)?/g, (whole, obj, method) => {
   if (LUA_KEYWORDS.has(method)) return whole;
   return obj + ':' + method + '(';
  });

  output = output.replace(/([A-Za-z0-9_)\]])\s*\[\s*["']([A-Za-z_][A-Za-z0-9_]*)["']\s*\]/g, (whole, prefix, prop) => {
   if (LUA_KEYWORDS.has(prop)) return whole;
   return prefix + '.' + prop;
  });

  const tableRe = /\blocal\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*\{([^{}]{1,8000})\}/g;
  const tables = new Map();
  while ((m = tableRe.exec(output)) !== null) {
   const tName = m[1], body = m[2].trim();
   if (!body) continue;
   const items = [];
   let idx = 0, ok = true;
   while (idx < body.length) {
    while (idx < body.length && /[\s,;]/.test(body[idx])) idx++;
    if (idx >= body.length) break;
    if (body[idx] === '"' || body[idx] === "'") {
     const q = body[idx]; let j = idx + 1;
     while (j < body.length) { if (body[j] === '\\') { j += 2; continue; } if (body[j++] === q) break; }
     items.push(body.slice(idx, j)); idx = j;
    } else {
     let j = idx;
     while (j < body.length && body[j] !== ',' && body[j] !== ';') j++;
     const chunk = body.slice(idx, j).trim();
     const num = evalSafeMath(chunk);
     if (num !== null) items.push(String(num));
     else if (chunk === 'true' || chunk === 'false' || chunk === 'nil') items.push(chunk);
     else { ok = false; break; }
     idx = j;
    }
   }
   if (ok && items.length > 0 && items.length <= 500) tables.set(tName, items);
  }
  for (const [tName, items] of tables.entries()) {
   const refRe = new RegExp('(?<![A-Za-z0-9_.])' + escapeRegExp(tName) + '\\s*\\[\\s*([0-9a-fA-FxX+\\-*/%().\\s]+)\\s*\\]', 'g');
   output = output.replace(refRe, (whole, idxExpr) => {
    const idxVal = evalSafeMath(idxExpr);
    if (idxVal !== null && Number.isInteger(idxVal) && idxVal >= 1 && idxVal <= items.length) {
     stats.tables++;
     return items[idxVal - 1];
    }
    return whole;
   });
  }

  if (output === snapshot) break;
 }

 if (options.renameVars || options.smartRobloxNames) {
  try {
   const renamed = semanticRenameLuau(output, {
    renameVars: options.renameVars,
    renameAllLocals: options.renameAllLocals,
    smartRobloxNames: options.smartRobloxNames
   });
   output = renamed.code;
   stats.vars = renamed.count;
  } catch {}
 }

 let formatted = output;
 try { formatted = formatLuau(output); } catch {}
 return { code: formatted, stats };
}

$('obfuscate').addEventListener('click', () => {
 const src = $('source').value;
 if (!src.trim()) { $('status').textContent = 'Masukkan source code terlebih dahulu.'; return; }
 try {
  const res = obfuscateLuauV7(src, {
   rename: true,
   strings: true,
   numbers: true,
   envProps: true,
   controlFlow: true,
   antiTamper: true
  });
  $('output').value = res;
  $('copy').disabled = false;
  $('download').disabled = false;
  $('status').textContent = ``;
 } catch (e) {
  $('status').textContent = 'Gagal meng-obfuscate: ' + e.message;
 }
});

$('deobfuscate').addEventListener('click', () => {
 const src = $('source').value;
 if (!src.trim()) { $('status').textContent = 'Masukkan kode obfuscator terlebih dahulu.'; return; }
 try {
  const { code, stats } = deobfuscateLuau(src, {
   smartRobloxNames: true,
   renameVars: true,
   renameAllLocals: false
  });
  $('output').value = code;
  $('copy').disabled = false; $('download').disabled = false;
  let msg = ``;
  if (stats.hasVM) {
   msg += '';
  }
  $('status').textContent = msg;
 } catch (e) { $('status').textContent = 'Gagal: ' + e.message; }
});

$('clear').addEventListener('click', () => {
 $('source').value = ''; $('output').value = '';
 $('copy').disabled = true; $('download').disabled = true; $('status').textContent = '';
});

$('copy').addEventListener('click', async () => {
 try { await navigator.clipboard.writeText($('output').value); $('status').textContent = 'Berhasil disalin.'; }
 catch { $('output').select(); document.execCommand('copy'); $('status').textContent = 'Disalin.'; }
});

$('download').addEventListener('click', () => {
 const blob = new Blob([$('output').value], { type: 'application/octet-stream' });
 const url = URL.createObjectURL(blob), a = document.createElement('a');
 a.style.display = 'none';
 a.href = url; a.download = 'DUTZxSTUDIO_DEOBFUSCATOR';
 document.body.appendChild(a);
 a.click();
 setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
});
</script>
